<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>hola mundo</h1>

    <button
      class="btn btn-dark btn-add-cart"
      data-id="1"
      data-name="Colgante Azul Océano"
      data-price="890"
      data-image="assets/shop.png"
    >
      Agregar al carrito
    </button>

    <!-- Componente Lateral del Carrito (Offcanvas) -->
    <div
      class="offcanvas offcanvas-end shadow"
      tabindex="-1"
      id="cartDrawer"
      aria-labelledby="cartDrawerLabel"
    >
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold" id="cartDrawerLabel">
          <i class="bi bi-bag me-2"></i> Tu Carrito
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>

      <div class="offcanvas-body d-flex flex-column justify-content-between">
        <!-- Lista de productos agregados (Aquí se inyectará con JavaScript) -->
        <div class="cart-items-container">
          <div
            class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-3"
          >
            <div class="d-flex align-items-center gap-3">
              <img
                src="Imagenes/colgante.jpg"
                alt="Producto"
                style="width: 50px; height: 50px; object-fit: cover"
                class="rounded"
              />
              <div>
                <h6 class="mb-0 fw-bold small">Colgante Azul Océano</h6>
                <small class="text-muted">Cant: 1</small>
              </div>
            </div>
            <span class="fw-bold text-danger">$890</span>
          </div>
        </div>

        <!-- Parte Inferior del Carrito: Totales y Botón de Checkout -->
        <div class="cart-footer border-top pt-3">
          <div class="d-flex justify-content-between mb-3">
            <span class="fw-bold">Subtotal:</span>
            <span class="fw-bold fs-5 text-dark">$890.00</span>
          </div>
          <!-- Botón que redirige al checkout.html que ya hiciste -->
          <a href="checkout.html" class="btn btn-dark w-100 py-2 fw-bold mb-2">
            Proceder al Pago
          </a>
          <button
            class="btn btn-outline-secondary w-100 btn-sm"
            data-bs-dismiss="offcanvas"
          >
            Seguir Comprando
          </button>
        </div>
      </div>
    </div>
    <!-- Componente Lateral del Carrito (Offcanvas) -->
    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo independiente del carrito -->
    <script src="../JS/cart.jsgit"></script>
  </body>
</html>
