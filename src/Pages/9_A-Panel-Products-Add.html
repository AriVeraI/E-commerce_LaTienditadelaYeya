<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Página responsiva -->
    <!-- Referencia a archivos con estilos -->
    <link rel="stylesheet" href="../Styles/style.css" />
    <link rel="stylesheet" href="../Styles/1_index.css" />
    <!-- Enlaces a librerías externas por CDN (FontAwesome, Bootstrap Icons y Bootstrap CSS) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Importación de fuentes tipográficas de Google Fonts (Fredoka y Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Título de la pestaña del navegador -->
    <title>Agregar nuevo producto</title>
  </head>

  <body>
    <!------------------------------------------------ NAVBAR PARA ADMIN--------------------------------------------->
    <header id="navbar1" class="main-header"></header>

    <!--------------------------------------PRINCIPAL----------------------------------------->
    <main>
      <section class="mx-5 my-3">
        <div class="card">
          <h4 class="mx-3">Agregar producto</h4>
          <p class="card-header">Compleata la información para publicar</p>
          <div class="card-body">
            <h5 class="card-title">Información básica</h5>
            <form action="">
              <div class="mb-3">
                <label for="titulo-producto" class="form-label">Titulo * </label>
                <input type="text" class="form-control" placeholder="Nombre del producto">
              </div>
              <div class="mb-3">
                <label for="titulo-producto" class="form-label">Categoría * </label>
                <input type="text" class="form-control" placeholder="Ej: Collares, Anillos..." >
              </div>
              <div class="mb-3">
                <label for="titulo-producto" class="form-label">Precio * </label>
                <input type="text" class="form-control" placeholder="$0.00">
              </div>
              <div class="mb-3">
                <label for="titulo-producto" class="form-label">Descripción * </label>
                <input type="text" class="form-control" placeholder="Escribe una descripción del producto" aria-label="Username">
              </div>
            </form>
          </div>
        </div>
        <form id="form-add-product" action=""></form>
      </section>
    </main>

    <!--------------------------------------LLAMADA AL SCRIPT----------------------------------------->
    <script src="../JScript/Navbar_Footer.js"></script>
  </body>
</html>
