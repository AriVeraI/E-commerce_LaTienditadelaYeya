<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">     <!-- Página responsiva -->
<!-- Referencia a archivos con estilos -->
  <link rel="stylesheet" href="../Styles/style.css">
  <link rel="stylesheet" href="../Styles/8_login.css">
<!-- Enlaces a librerías externas por CDN (FontAwesome, Bootstrap Icons y Bootstrap CSS) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<!-- Importación de fuentes tipográficas de Google Fonts (Fredoka y Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<!-- Título de la pestaña del navegador -->
  <title>Client-Login</title>
</head>

<body>
<!------------------------------------------------ NAVBAR --------------------------------------------->
  <header id="navbar1" class="main-header"></header>

<!--------------------------------------PRINCIPAL----------------------------------------->
  <main>
  <section class="contenedor-inicio-sesion">
    <div id="inicio-de-sesion" class="container">
      <div>
        <h1 fw-bold mb-2>Bienvenido de vuelta</h1>
        <p>Ingresa tus credenciales para acceder tu cuenta.</p>
      </div>
      <div>
        <!-- Agregamos novalidate e id="loginForm" -->
        <form id="loginForm" novalidate>
          <div class="form-group mb-3">
            <label for="exampleInputEmail1" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="ana@ejemplo.com">
            <!-- Contenedor para el error del correo -->
            <div id="emailError" class="invalid-feedback"></div>
          </div>

          <div class="form-group mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="exampleInputPassword1" class="form-label mb-0">Contraseña</label>
              <!-- Usamos utilidades de Bootstrap en lugar de margin-left inline para mejor responsividad -->
              <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="********">
            <!-- Contenedor para el error de la contraseña -->
            <div id="passwordError" class="invalid-feedback"></div>
          </div>

          <button type="submit" id="btnSend" class="btn w-100 py-3 fw-bold">Iniciar Sesión</button>
        </form>
      </div>
      <p class="register-text">
        ¿No tienes una cuenta? 
        <a href="../Pages/8_Client-Register.html" class="register-link">Regístrate ahora</a>
      </p>
    </div>
  </section>
  </main>


  <!--------------------------------------- Footer ---------------------------------------------------->
  <footer id="footer1" class="footer-seccion py-5 px-4 px-md-5"></footer>

  <script src="../JScript/Navbar_Footer.js"></script>
  
</body>
</html>
