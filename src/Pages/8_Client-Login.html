<!doctype html>
<html lang="en">
  <head>
    <!-------------POR FAVOR MANTEN EL ORDEN DEL HEAD COMO ESTÁ, AÑADE LO QUE NECESITES EN LA SECCIÓN CORRESPONDIENTE (CADA LINK O REFERENCIA EN UNA LÍNEA DE CÓDIGO)------------------------------------------------------------>
    <meta charset="UTF-8" />
    <meta charset="UTF-8" />
    <!-- Página responsiva -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Referencia a archivos con estilos -->
    <link rel="stylesheet" href="../Styles/style.css" />
    <link rel="stylesheet" href="../Styles/8_login.css" />
    <!-- Enlaces a librerías externas por CDN (FontAwesome, Bootstrap Icons y Bootstrap CSS) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Importación de fuentes tipográficas de Google Fonts (Fredoka y Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Título de la pestaña del navegador -->
    <title>Client-Login</title>
    <link rel="stylesheet" href="../Styles/11_predeploy.css">
</head>

  <body>
    <!------------------------------------------------ NAVBAR --------------------------------------------->
    <header id="navbar1" class="main-header"></header>

    <!--------------------------------------PRINCIPAL----------------------------------------->
    <main>
      <section class="contenedor-inicio-sesion">
        <div id="inicio-de-sesion" class="container">
          <div>
            <h1 class="fw-bold mb-2"><strong>Bienvenido de vuelta</strong></h1>
            <p>Ingresa tus credenciales para acceder tu cuenta.</p>
          </div>
          <div>
            <form id="loginForm" novalidate>
              <div class="form-group mb-3">
                <label for="exampleInputEmail1" class="form-label"
                  >Correo Electrónico</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="exampleInputEmail1"
                  aria-describedby="emailHelp"
                  placeholder="ana@ejemplo.com"
                />
                <!-- Contenedor para el error del correo -->
                <div id="emailError" class="invalid-feedback"></div>
              </div>

              <div class="form-group mb-3">
                <div
                  class="d-flex justify-content-between align-items-center mb-1"
                >
                  <label for="exampleInputPassword1" class="form-label mb-0"
                    >Contraseña</label
                  >
                  <a href="#" class="forgot-password" data-forgot-password
                    >¿Olvidaste tu contraseña?</a
                  >
                </div>
                <div class="input-group">
                  <!-- CORREGIDO: Cambiado id a 'exampleInputPassword1' para sincronizarlo al 100% con tu script de validación -->
                  <input
                    type="password"
                    id="exampleInputPassword1"
                    class="form-control entrada-texto border-end-0"
                    placeholder="******"
                    required
                  />
                  <button
                    type="button"
                    class="btn border border-start-0 bg-white boton-mostrar-clave"
                    id="toggle-clave-1"
                    tabindex="-1"
                  >
                    <i class="bi bi-eye icono-ojo text-muted"></i>
                  </button>
                </div>
                <!-- Contenedor para el error de la contraseña -->
                <div id="passwordError" class="invalid-feedback"></div>
              </div>

              <button type="submit" id="btnSend" class="btn w-100 py-3 fw-bold">
                Iniciar Sesión
              </button>
            </form>
          </div>
          <p class="register-text">
            ¿No tienes una cuenta?
            <a href="../Pages/8_Client-Register.html" class="register-link"
              >Regístrate ahora</a
            >
          </p>
        </div>
      </section>
    </main>

    <!--------------------------------------- Footer ---------------------------------------------------->
    <footer id="footer1" class="footer-seccion py-5 px-4 px-md-5"></footer>

    <!-- SCRIPT de Card, Bootstrap, carrito lateral, Navbar y Footer (MANTENER UN LINK POR LÍNEA DE CÓDIGO POR FAVOR)-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JScript/RuntimeConfig.js"></script>
    <script src="../JScript/ApiConfig.js"></script>
    <script src="../JScript/StoreConfig.js"></script>
    <script src="../JScript/Auth.js"></script>
    <script src="../JScript/Navbar_Footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JScript/Client-Login-Register.js"></script>
  </body>
</html>
