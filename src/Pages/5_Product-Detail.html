<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../Styles/style.css" />
  <link rel="stylesheet" href="../Styles/1_index.css" />
  <link rel="stylesheet" href="../Styles/4_productDetail.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:wght@100..900&display=swap" rel="stylesheet" />
  <title>Detalle de producto - La Tiendita de la Yeya</title>
  <link rel="stylesheet" href="../Styles/11_predeploy.css">
</head>
<body>
  <header id="navbar1" class="main-header"></header>
  <main class="container py-5">
    <div id="product-detail-loading" class="text-center py-5">Cargando producto...</div>
    <div id="product-detail-content" class="row g-5 align-items-start d-none">
      <div class="col-lg-6">
        <img id="detail-image" class="img-fluid w-100 rounded-4 shadow-sm" style="max-height:560px;object-fit:cover" alt="Producto" />
      </div>
      <div class="col-lg-6">
        <span id="detail-category" class="badge rounded-pill mb-3" style="background:#f8e8eb;color:#C66271"></span>
        <h1 id="detail-name" class="fw-bold mb-2"></h1>
        <p id="detail-sku" class="text-muted small"></p>
        <p id="detail-description" class="text-secondary fs-5"></p>
        <div class="d-flex align-items-center gap-3 mb-4">
          <span id="detail-price" class="fw-bold fs-2" style="color:#C66271"></span>
          <span id="detail-stock" class="small"></span>
        </div>
        <button id="detail-add-cart" class="btn px-5 py-3 rounded-pill text-white fw-bold" style="background:#C66271">Agregar al carrito</button>
        <hr class="my-4" />
        <div class="row g-3 text-secondary">
          <div class="col-md-6"><i class="bi bi-truck me-2"></i>Envío estándar</div>
          <div class="col-md-6"><i class="bi bi-shield-check me-2"></i>Compra protegida</div>
          <div class="col-md-6"><i class="bi bi-arrow-counterclockwise me-2"></i>Consulta políticas de devolución</div>
          <div class="col-md-6"><i class="bi bi-box-seam me-2"></i>Stock actualizado en tiempo real</div>
        </div>
      </div>
    </div>
    <div id="product-detail-error" class="alert alert-danger d-none"></div>
  </main>
  <div id="cart-drawer-container"></div>
  <footer id="footer1" class="footer-seccion py-5 px-4 px-md-5"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JScript/RuntimeConfig.js"></script>
    <script src="../JScript/ApiConfig.js"></script>
    <script src="../JScript/StoreConfig.js"></script>
    <script src="../JScript/Auth.js"></script>
  <script src="../JScript/Cart.js"></script>
  <script src="../JScript/Navbar_Footer.js"></script>
  <script src="../JScript/Product-Detail.js"></script>
</body>
</html>
