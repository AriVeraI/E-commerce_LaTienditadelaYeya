<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">     <!-- Página responsiva -->
<!-- Referencia a archivos con estilos -->
  <link rel="stylesheet" href="../Styles/style.css">
  <link rel="stylesheet" href="../Styles/1_index.css">
  <link rel="stylesheet" href="../Styles/3_catalogItems.css">
  <!-- Enlaces a librerías externas por CDN (FontAwesome, Bootstrap Icons y Bootstrap CSS) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<!-- Importación de fuentes tipográficas de Google Fonts (Fredoka y Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<!-- Título de la pestaña del navegador -->
  <title>Catalog-Items</title>
</head>

<body>
<!------------------------------------------------ NAVBAR --------------------------------------------->
  <header id="navbar1" class="main-header"></header>

<!--------------------------------------PRINCIPAL----------------------------------------->
  <main class="container my-5">
      <!-- Título y barra de búsqueda superior -->
        <div class="row align-items-center mb-4">
            <div class="col-md-8">
                <h2 class="fw-bold text-dark">Nuestro Catálogo</h2>
                <p class="text-muted mb-0">Explora más de 150+ piezas elaboradas cuidadosamente.</p>
            </div>
            <div class="col-md-4 mt-3 mt-md-0">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="search-input" class="form-control border-start-0 ps-0" placeholder="Buscar productos...">
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Columna Izquierda: Filtros -->
            <aside class="col-lg-3 mb-4">
                <div class="p-4 border rounded-3 bg-white shadow-sm">
                    <!-- Categoría -->
                    <h6 class="fw-bold mb-3">Categoría</h6>
                    <div class="mb-3">
                        <div class="form-check"><input class="form-check-input filter-checkbox" type="checkbox" value="todos" id="cat-todos" checked><label class="form-check-label" for="cat-todos">Todos</label></div>
                        <div class="form-check"><input class="form-check-input filter-checkbox" type="checkbox" value="Anillos" id="cat-anillos"><label class="form-check-label" for="cat-anillos">Anillos</label></div>
                        <div class="form-check"><input class="form-check-input filter-checkbox" type="checkbox" value="Collares" id="cat-collares"><label class="form-check-label" for="cat-collares">Collares</label></div>
                        <div class="form-check"><input class="form-check-input filter-checkbox" type="checkbox" value="Pulseras" id="cat-pulseras"><label class="form-check-label" for="cat-pulseras">Pulseras</label></div>
                        <div class="form-check"><input class="form-check-input filter-checkbox" type="checkbox" value="Pendientes" id="cat-pendientes"><label class="form-check-label" for="cat-pendientes">Pendientes</label></div>
                    </div>
                    <hr>
                    <!-- Género / Tipo -->
                    <h6 class="fw-bold mb-3">Género / Tipo</h6>
                    <div class="mb-3">
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-mujer"><label class="form-check-label" for="gen-mujer">Mujer</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-hombre"><label class="form-check-label" for="gen-hombre">Hombre</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-unisex"><label class="form-check-label" for="gen-unisex">Unisex</label></div>
                    </div>
                    <hr>
                    <!-- Material -->
                    <h6 class="fw-bold mb-3">Material</h6>
                    <div class="mb-3">
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="mat-oro18k"><label class="form-check-label" for="mat-oro18k">Oro 18k</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="mat-rosado"><label class="form-check-label" for="mat-rosado">Oro Rosado</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="mat-plata"><label class="form-check-label" for="mat-plata">Plata</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="mat-platino"><label class="form-check-label" for="mat-platino">Platino</label></div>
                    </div>
                    <hr>
                    <!-- Rango de Precios -->
                    <h6 class="fw-bold mb-3">Rango de Precios</h6>
                    <input type="range" class="form-range" min="50" max="1500" id="priceRange">
                    <div class="d-flex justify-content-between text-muted small">
                        <span>$50</span>
                        <span>$1500</span>
                    </div>
                </div>
            </aside>

            <!-- Columna Derecha: Cuadrícula de Productos Dinámica -->
            <section class="col-lg-9">
                <div id="product-grid" class="row row-cols-1 row-cols-md-3 g-4">
                    <!-- Los productos se inyectarán dinámicamente aquí mediante JavaScript -->
                </div>

                <!-- Paginación -->
                <nav class="mt-5 d-flex justify-content-center">
                    <ul class="pagination">
                        <li class="page-item disabled"><a class="page-link" href="#">&laquo;</a></li>
                        <li class="page-item active"><a class="page-link bg-danger border-danger" href="#">1</a></li>
                        <li class="page-item"><a class="page-link text-dark" href="#">2</a></li>
                        <li class="page-item"><a class="page-link text-dark" href="#">3</a></li>
                        <li class="page-item"><a class="page-link text-dark" href="#">&raquo;</a></li>
                    </ul>
                </nav>
            </section>
        </div>
  </main>

    <!-- Componente Lateral del Carrito (Offcanvas) -->
    <div id="cart-drawer-container"></div>

    <!--------------------------------------- Footer ---------------------------------------------------->
    <footer id="footer1" class="footer-seccion py-5 px-4 px-md-5"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" ></script>
    <script src="../JScript/Cart.js"></script>
    <script src="../JScript/Navbar_Footer.js"></script>
    <script src="../JScript/Catalog-Items.js"></script>
  
  </body>
</html>
