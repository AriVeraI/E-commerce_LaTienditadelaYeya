<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles/style.css">
    <link rel="stylesheet" href="../Styles/1_index.css">
    <link rel="stylesheet" href="../Styles/2_cartCheckout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Finalizar Compra - La tiendita de la Yeya</title>
  </head>

  <body>
    <header id="navbar1" class="main-header"></header>

    <main class="container my-5">
      <h2 class="mb-4 fw-bold">Finalizar Compra</h2>

      <div class="row">
        <div class="col-lg-8">
          
          <div class="card shadow-sm border-0 mb-4 p-4">
            <h5 class="fw-bold mb-3">
              <span class="badge rounded-circle bg-secondary me-2">1</span> Tu Carrito
            </h5>
            
            <div id="checkout-cart-items">
              </div>
          </div>

          <div class="card shadow-sm border-0 mb-4 p-4">
            <h5 class="fw-bold mb-3">
              <span class="badge rounded-circle bg-secondary me-2">2</span> Dirección de Envío
            </h5>
            <form id="shipping-form" novalidate>
              <div class="mb-3">
                <label for="shipping-name" class="form-label text-muted small">Nombre Completo</label>
                <input type="text" class="form-control" id="shipping-name" placeholder="Ej. Ana Pérez" required />
              </div>
              <div class="mb-3">
                <label for="shipping-address" class="form-label text-muted small">Dirección (Calle y número)</label>
                <input type="text" class="form-control" id="shipping-address" placeholder="Ej. Av. Reforma 222, Depto 4" required />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="shipping-city" class="form-label text-muted small">Ciudad</label>
                  <input type="text" class="form-control" id="shipping-city" placeholder="Ej. Ciudad de México" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="shipping-zip" class="form-label text-muted small">Código Postal</label>
                  <input type="text" class="form-control" id="shipping-zip" placeholder="Ej. 06600" maxlength="5" required />
                </div>
              </div>
              <div class="mb-3">
                <label for="shipping-phone" class="form-label text-muted small">Número de Teléfono (10 dígitos)</label>
                <input type="tel" class="form-control" id="shipping-phone" placeholder="Ej. 5512345678" maxlength="10" required />
              </div>
            </form>
          </div>

          <div class="card shadow-sm border-0 mb-4 p-4">
            <h5 class="fw-bold mb-3">
              <span class="badge rounded-circle bg-secondary me-2">3</span> Método de Pago
            </h5>
            
            <form id="payment-form">
              <div class="form-check mb-3 p-3 border rounded">
                <input class="form-check-input" type="radio" name="metodoPago" id="metodo-tarjeta" value="tarjeta" checked />
                <label class="form-check-label fw-bold ms-2" for="metodo-tarjeta">
                  <i class="bi bi-credit-card me-2"></i> Tarjeta de Crédito o Débito
                </label>
                
                <div id="campos-tarjeta" class="mt-3">
                  <div class="mb-2">
                    <input type="text" class="form-control" id="card-name" placeholder="Nombre en la tarjeta" />
                  </div>
                  <div class="mb-2">
                    <input type="text" class="form-control" id="card-number" placeholder="Número de Tarjeta (16 dígitos)" maxlength="16" />
                  </div>
                  <div class="row">
                    <div class="col-6">
                      <input type="text" class="form-control" id="card-exp" placeholder="MM/AA" maxlength="5" />
                    </div>
                    <div class="col-6">
                      <input type="password" class="form-control" id="card-cvv" placeholder="CVV (3 ó 4 dígitos)" maxlength="4" />
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-check p-3 border rounded">
                <input class="form-check-input" type="radio" name="metodoPago" id="metodo-paypal" value="paypal" />
                <label class="form-check-label fw-bold ms-2" for="metodo-paypal">
                  <i class="bi bi-paypal me-2"></i> PayPal / Mercado Pago
                </label>
              </div>
            </form>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm border-0 p-4 sticky-top" style="top: 20px">
            <h5 class="fw-bold mb-3">Resumen de Compra</h5>
            <div class="d-flex justify-content-between mb-2 text-muted">
              <span>Subtotal</span>
              <span id="checkout-subtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-2 text-muted">
              <span>Envío</span>
              <span class="text-success fw-bold">Gratis</span>
            </div>
            <hr />
            <div class="d-flex justify-content-between mb-3">
              <span class="fw-bold fs-5">Total</span>
              <span class="fw-bold fs-5 text-danger" id="checkout-total">$0.00</span>
            </div>
            <button id="btn-finalizar-compra" class="btn btn-dark w-100 py-2 fw-bold shadow-sm">
              Finalizar Compra
            </button>
            <small class="text-center text-muted mt-3 d-block">
              <i class="bi bi-lock"></i> Pago Seguro (Encriptación SSL 256-bit)
            </small>
          </div>
        </div>
      </div>
    </main>

    <div id="cart-drawer-container"></div>

    <footer id="footer1" class="footer-seccion py-5 px-4 px-md-5"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../JScript/Cart.js"></script>
    <script src="../JScript/Cart_Checkout_Thanks.js"></script>
    <script src="../JScript/Navbar_Footer.js"></script>
  </body>
</html>
